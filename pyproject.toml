[project]
name = "mini-dts-hub-tools"
version = "0.1.0"
description = "Tooling for MiniDts-Hub docs and modules"
requires-python = ">=3.11"

[project.scripts]
nuevo-modulo = "tools.nuevo_modulo:main"
docs-check = "tools.docs_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.uv]
package = true